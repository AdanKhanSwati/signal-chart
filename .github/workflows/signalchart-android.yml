name: SignalChart Android previews
on:
  push:
    branches: [signalchart-android-landing]
    paths: ['mobile/**', '.github/workflows/signalchart-android.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/signalchart-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and verify both Android apps
        run: gradle --no-daemon testCustomerDebugUnitTest testAdminDebugUnitTest lintCustomerDebug lintAdminDebug assembleCustomerDebug assembleAdminDebug bundleCustomerRelease bundleAdminRelease
      - name: Upload APKs and unsigned bundles
        uses: actions/upload-artifact@v4
        with:
          name: signalchart-android-preview
          path: |
            mobile/android/app/build/outputs/apk/**/*.apk
            mobile/android/app/build/outputs/bundle/**/*.aab
            mobile/android/app/build/reports/lint-results-*.html
          if-no-files-found: error
          retention-days: 30

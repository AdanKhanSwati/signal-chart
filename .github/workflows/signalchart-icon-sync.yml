name: Sync approved SignalChart Android/PWA icons
on:
  push:
    branches: [signalchart-cloudflare-free-migration]
    paths:
      - 'brand/approved-signalchart-two-bars.png'
      - 'scripts/sync-signalchart-icons.py'
      - '.github/workflows/signalchart-icon-sync.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signalchart-brand-sync
  cancel-in-progress: true
jobs:
  sync-icons:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install image resizer
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Build branded PNGs, Android launchers and SVG favicon wrappers
        run: python scripts/sync-signalchart-icons.py
      - name: Commit exact icon asset outputs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops-icon-192.png ops-icon-512.png ops-icon.svg signalchart-mark.svg mobile/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png mobile/android/app/src/main/res/drawable/brand_icon.png
          if git diff --cached --quiet; then
            echo 'Icons already match original approved mark'
          else
            git commit -m 'Use exact approved two-bar logo for Android and PWA launchers'
            git push origin HEAD:signalchart-cloudflare-free-migration
          fi
